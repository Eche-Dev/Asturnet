  <rect x="234.14750000000004" y="30" width="87.30199999999999" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="277.79850000000005" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Coches()</text>
</g>
<g class="actor" data-id="HijoParam" data-label="Coches(int limite)" data-type="participant">
  <rect x="361.44950000000006" y="30" width="131.02100000000002" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="426.96000000000004" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Coches(int limite)</text>
</g>
<g class="actor" data-id="Padre" data-label="Vehiculos(String tipo, int limite)" data-type="participant">
  <rect x="532.4705000000001" y="30" width="208.08499999999992" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="636.513" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Vehiculos(String tipo, int limite)</text>
