  <text x="531.7365" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">3. Salta a Vehiculos(&quot;Coche&quot;, 50)</text>
  <circle class="sequence-number" cx="426.96000000000004" cy="200" r="9" fill="var(--_arrow)" stroke="var(--bg)" stroke-width="1" />
  <text x="426.96000000000004" y="200" class="sequence-number-label" font-size="10" text-anchor="middle" font-weight="600" fill="var(--bg)" dy="3.5">3</text>
</g>
<g class="note" data-position="over" data-actors="HijoVacio">
  <polygon points="189.5355,98 360.0615,98 366.0615,104 366.0615,121 189.5355,121" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="360.0615,98 366.0615,104 360.0615,104" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="277.79850000000005" y="109.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">this(50); pasa el 50 a su hermano</text>
</g>
<g class="note" data-position="over" data-actors="HijoParam">
  <polygon points="320.877,153 527.043,153 533.043,159 533.043,176 320.877,176" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="527.043,153 533.043,159 527.043,159" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="426.96000000000004" y="164.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">super(&quot;Coche&quot;, 50); se lo manda al padre</text>
</g>
<g class="note" data-position="over" data-actors="Padre">
  <polygon points="542.013,208 725.013,208 731.013,214 731.013,231 542.013,231" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="725.013,208 731.013,214 725.013,214" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="636.513" y="219.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">this.limite = 50; ¡AQUÍ SE GUARDA!</text>
</g>
<g class="actor" data-id="Main" data-label="new Coches()" data-type="participant">
